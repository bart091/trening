<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dziennik Treningowy</title>

  <!-- PWA & Ekran Główny -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trening">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Blokada przewijania w bok */
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden !important;
      position: relative;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      background-color: #090d16;
    }

    * {
      box-sizing: border-box;
    }

    /* Ukrycie pasków przewijania w poziomych chipach */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pulsująca animacja stopera po skończeniu czasu */
    @keyframes restFinishedPulse {
      0%, 100% { transform: scale(1); background-color: rgba(239, 68, 68, 0.2); }
      50% { transform: scale(1.03); background-color: rgba(239, 68, 68, 0.4); }
    }
    .timer-alert {
      animation: restFinishedPulse 1s infinite ease-in-out;
      border-color: #ef4444 !important;
      color: #ef4444 !important;
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen pb-14 font-sans selection:bg-brand-500 selection:text-white">

  <!-- GÓRNY PASEK NAWIGACJI -->
  <header class="sticky top-0 z-40 bg-[#090d16]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 max-w-lg mx-auto w-full flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-cyan-400 flex items-center justify-center font-bold text-white shadow-md shadow-brand-500/20">
        ⚡
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-white leading-tight">Dziennik Treningowy</h1>
        <p class="text-[11px] text-slate-400 font-medium" id="headerDate">Dziś</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="btnOpenPlans" class="px-2.5 py-1.5 rounded-lg bg-slate-800/90 text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-700 transition active:scale-95 border border-slate-700/60">
        📋 Plany
      </button>
      <button id="btnClearToday" title="Wyczyść dzisiejszy trening" class="p-1.5 rounded-lg bg-slate-800/80 text-slate-400 hover:text-rose-400 hover:bg-slate-700 transition active:scale-95 border border-slate-700/60">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </button>
    </div>
  </header>

  <!-- KONTENER GŁÓWNY -->
  <main class="max-w-lg mx-auto w-full px-4 pt-3 space-y-4">

    <!-- MODUŁ LICZNIKA CZASU MIĘDZY SERIAMI (REST TIMER) -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3.5 shadow-lg shadow-black/40">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Przerwa między seriami
        </span>
        <label class="flex items-center gap-1.5 text-[11px] text-slate-400 cursor-pointer">
          <input type="checkbox" id="autoStartTimerCheck" checked class="rounded bg-slate-800 border-slate-700 text-brand-500 focus:ring-0">
          <span>Auto-start</span>
        </label>
      </div>

      <div class="flex items-center justify-between gap-3 bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5">
        <!-- Wyświetlacz czasu -->
        <div class="flex flex-col">
          <span id="timerDisplay" class="font-mono text-3xl font-extrabold tracking-wider text-brand-400">01:30</span>
          <span id="timerStatus" class="text-[10px] text-slate-500 font-medium">Gotowy do startu</span>
        </div>

        <!-- Sterowanie stoperem -->
        <div class="flex items-center gap-1.5">
          <button id="btnToggleTimer" class="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 active:scale-95 text-xs font-bold text-white shadow-md shadow-brand-600/30 transition">
            Start
          </button>
          <button id="btnAdd30s" class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold text-slate-300 border border-slate-700">
            +30s
          </button>
          <button id="btnResetTimer" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-400 border border-slate-700" title="Resetuj">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          </button>
        </div>
      </div>

      <!-- Presety czasu odpoczynku -->
      <div class="grid grid-cols-4 gap-1.5 mt-2.5">
        <button data-seconds="60" class="btn-preset py-1 text-xs rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium border border-slate-700/60 active:scale-95">60s</button>
        <button data-seconds="90" class="btn-preset active py-1 text-xs rounded-lg bg-brand-600/20 text-brand-400 font-bold border border-brand-500/40 active:scale-95">90s</button>
        <button data-seconds="120" class="btn-preset py-1 text-xs rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium border border-slate-700/60 active:scale-95">120s</button>
        <button data-seconds="180" class="btn-preset py-1 text-xs rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium border border-slate-700/60 active:scale-95">180s</button>
      </div>
    </section>

    <!-- AKTYWNY PLAN TRENINGOWY (WIDGET POSTĘPU) -->
    <section id="activePlanWidget" class="hidden bg-slate-900/80 border border-brand-500/30 rounded-2xl p-3.5 shadow-lg">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-bold text-brand-400 flex items-center gap-1.5">
          <span>🎯</span> <span id="activePlanTitle">Plan Treningowy</span>
        </span>
        <button id="btnCloseActivePlan" class="text-[11px] text-slate-400 hover:text-slate-200">Zwiń</button>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-1.5 mb-2 overflow-hidden">
        <div id="planProgressBar" class="bg-brand-500 h-1.5 transition-all duration-300" style="width: 0%"></div>
      </div>
      <div id="activePlanExercises" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
    </section>

    <!-- FORMULARZ DODAWANIA SERII -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl shadow-black/50">
      <form id="setForm" onsubmit="return false;" class="space-y-3.5">
        
        <!-- Wybór / Wpisanie ćwiczenia -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Ćwiczenie</label>
          <div class="relative">
            <input 
              type="text" 
              id="exerciseInput" 
              list="commonExercises" 
              placeholder="np. Wyciskanie sztangi leżąc" 
              autocomplete="off"
              class="w-full bg-slate-950 border border-slate-700/80 focus:border-brand-500 focus:ring-1 focus:ring-brand-500 text-white rounded-xl px-3.5 py-3 text-sm font-medium placeholder-slate-500 transition outline-none"
            >
            <datalist id="commonExercises">
              <option value="Wyciskanie sztangi leżąc">
              <option value="Wyciskanie hantli skos dodatni">
              <option value="Przysiad ze sztangą">
              <option value="Martwy ciąg">
              <option value="Podciąganie na drążku">
              <option value="Wiosłowanie sztangą w opadzie">
              <option value="Wyciskanie żołnierskie (OHP)">
              <option value="Wznosy bokiem na barki">
              <option value="Dipsy (pompki na poręczach)">
              <option value="Uginanie ramion z hantlami">
              <option value="Prostowanie ramion na wyciągu">
            </datalist>
          </div>

          <!-- Szybkie chipy ćwiczeń -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pt-2 pb-0.5">
            <button type="button" class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/90 text-[11px] font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700 border border-slate-700/50">Wyciskanie</button>
            <button type="button" class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/90 text-[11px] font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700 border border-slate-700/50">Przysiad</button>
            <button type="button" class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/90 text-[11px] font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700 border border-slate-700/50">Martwy ciąg</button>
            <button type="button" class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/90 text-[11px] font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700 border border-slate-700/50">Podciąganie</button>
            <button type="button" class="quick-chip px-2.5 py-1 rounded-lg bg-slate-800/90 text-[11px] font-medium text-slate-300 whitespace-nowrap hover:bg-slate-700 border border-slate-700/50">OHP</button>
          </div>
        </div>

        <!-- Pomiary: Ciężar i Powtórzenia w dwóch wygodnych kolumnach -->
        <div class="grid grid-cols-2 gap-3">
          
          <!-- Ciężar -->
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-semibold text-slate-400">Ciężar (kg)</span>
              <span class="text-[10px] text-slate-500 font-mono">krok 2.5</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" id="btnWeightMinus" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 text-lg font-bold text-slate-300 flex items-center justify-center transition border border-slate-700">−</button>
              <input 
                type="number" 
                step="0.5" 
                id="weightInput" 
                value="60" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 text-center text-lg font-mono font-bold text-white focus:border-brand-500 focus:outline-none"
              >
              <button type="button" id="btnWeightPlus" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 text-lg font-bold text-slate-300 flex items-center justify-center transition border border-slate-700">+</button>
            </div>
          </div>

          <!-- Powtórzenia -->
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2.5">
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-semibold text-slate-400">Powtórzenia</span>
              <span class="text-[10px] text-slate-500 font-mono">krok 1</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" id="btnRepsMinus" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 text-lg font-bold text-slate-300 flex items-center justify-center transition border border-slate-700">−</button>
              <input 
                type="number" 
                step="1" 
                id="repsInput" 
                value="8" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 text-center text-lg font-mono font-bold text-white focus:border-brand-500 focus:outline-none"
              >
              <button type="button" id="btnRepsPlus" class="w-10 h-10 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-90 text-lg font-bold text-slate-300 flex items-center justify-center transition border border-slate-700">+</button>
            </div>
          </div>

        </div>

        <!-- Duży główny przycisk dodawania serii -->
        <button 
          type="button" 
          id="btnSaveSet" 
          class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 active:scale-[0.98] font-bold text-white text-base shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
          Zapisz serię
        </button>
      </form>
    </section>

    <!-- LISTA ZAPISANYCH SERII DZISIAJ -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-bold tracking-tight text-white uppercase tracking-wider">Dzisiejsza sesja</h2>
          <span id="setsCountBadge" class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700">0 serii</span>
        </div>

        <!-- Przełącznik widoku: Pogrupowane / Ostatnie -->
        <div class="flex items-center bg-slate-900 border border-slate-800 p-0.5 rounded-lg text-[11px]">
          <button id="viewGrouped" class="px-2 py-1 rounded font-semibold bg-brand-600 text-white transition">Grupy</button>
          <button id="viewTimeline" class="px-2 py-1 rounded font-semibold text-slate-400 hover:text-white transition">Ostatnie</button>
        </div>
      </div>

      <div id="workoutContainer" class="space-y-2.5">
        <!-- Generowane dynamicznie -->
      </div>
    </section>

  </main>

  <!-- MODAL: ZARZĄDZANIE PLANAMI TRENINGOWYMI -->
  <div id="plansModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-t-2xl sm:rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-white text-sm">Plany Treningowe</h3>
        <button id="btnClosePlans" class="text-slate-400 hover:text-white text-xl p-1 leading-none">&times;</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 text-xs">
        <div>
          <span class="font-semibold text-slate-400 uppercase tracking-wider text-[10px] block mb-2">Gotowe szablony</span>
          <div class="grid grid-cols-2 gap-2" id="templatesList"></div>
        </div>

        <div class="border-t border-slate-800 pt-3">
          <span class="font-semibold text-slate-400 uppercase tracking-wider text-[10px] block mb-1.5">Wklej własny plan (tekst)</span>
          <p class="text-[11px] text-slate-500 mb-2">Wpisz ćwiczenia w osobnych linijkach, np.: <br><code class="text-slate-400">Przysiad ze sztangą | 4 | 8</code></p>
          <input type="text" id="customPlanName" placeholder="Nazwa planu (np. Mój FBW)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-2 mb-2 text-white outline-none focus:border-brand-500">
          <textarea id="customPlanText" rows="4" placeholder="Wyciskanie leżąc | 4 | 8&#10;Przysiad | 4 | 8&#10;Wiosłowanie | 3 | 10" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white outline-none focus:border-brand-500 font-mono text-[11px]"></textarea>
          <button id="btnSaveCustomPlan" class="mt-2 w-full py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold border border-slate-700 transition">Zapisz i aktywuj plan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT: LOGIKA APLIKACJI, STOPERA I ZAPISU -->
  <script>
    // --- BAZA DANYCH W LOCALSTORAGE ---
    const STORAGE_KEY = 'gym_workout_sets_v2';
    const ACTIVE_PLAN_KEY = 'gym_active_plan_v2';
    const TIMER_PRESET_KEY = 'gym_timer_preset';

    let sets = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activePlan = JSON.parse(localStorage.getItem(ACTIVE_PLAN_KEY) || 'null');
    let currentView = 'grouped'; // 'grouped' lub 'timeline'

    // --- ELEMENTY DOM ---
    const exerciseInput = document.getElementById('exerciseInput');
    const weightInput = document.getElementById('weightInput');
    const repsInput = document.getElementById('repsInput');
    const btnSaveSet = document.getElementById('btnSaveSet');
    const workoutContainer = document.getElementById('workoutContainer');
    const setsCountBadge = document.getElementById('setsCountBadge');
    const headerDate = document.getElementById('headerDate');

    // Licznik / Stoper
    const timerDisplay = document.getElementById('timerDisplay');
    const timerStatus = document.getElementById('timerStatus');
    const btnToggleTimer = document.getElementById('btnToggleTimer');
    const btnResetTimer = document.getElementById('btnResetTimer');
    const btnAdd30s = document.getElementById('btnAdd30s');
    const autoStartTimerCheck = document.getElementById('autoStartTimerCheck');
    const presetButtons = document.querySelectorAll('.btn-preset');

    // --- ZARZĄDZANIE LICZNIKIEM PRZERW (REST TIMER) ---
    let timerTargetSeconds = parseInt(localStorage.getItem(TIMER_PRESET_KEY) || '90', 10);
    let timerRemainingSeconds = timerTargetSeconds;
    let timerInterval = null;
    let timerRunning = false;

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateTimerUI() {
      timerDisplay.textContent = formatTime(timerRemainingSeconds);
      if (timerRemainingSeconds <= 0 && timerRunning) {
        timerDisplay.classList.add('timer-alert');
        timerStatus.textContent = 'Czas minął! Następna seria!';
      } else {
        timerDisplay.classList.remove('timer-alert');
        timerStatus.textContent = timerRunning ? 'Odliczanie odpoczynku...' : 'Zatrzymany';
      }
      btnToggleTimer.textContent = timerRunning ? 'Pauza' : 'Start';
      btnToggleTimer.className = timerRunning 
        ? 'px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-xs font-bold text-white shadow transition'
        : 'px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-xs font-bold text-white shadow transition';
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {}

      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    function startTimer() {
      if (timerRemainingSeconds <= 0) {
        timerRemainingSeconds = timerTargetSeconds;
      }
      clearInterval(timerInterval);
      timerRunning = true;
      updateTimerUI();

      timerInterval = setInterval(() => {
        if (timerRemainingSeconds > 0) {
          timerRemainingSeconds--;
          updateTimerUI();
          if (timerRemainingSeconds === 0) {
            playBeep();
            updateTimerUI();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      updateTimerUI();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerRemainingSeconds = timerTargetSeconds;
      updateTimerUI();
    }

    btnToggleTimer.addEventListener('click', () => {
      if (timerRunning) pauseTimer();
      else startTimer();
    });

    btnResetTimer.addEventListener('click', resetTimer);

    btnAdd30s.addEventListener('click', () => {
      timerRemainingSeconds += 30;
      updateTimerUI();
    });

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => {
          b.className = 'btn-preset py-1 text-xs rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium border border-slate-700/60 active:scale-95';
        });
        btn.className = 'btn-preset active py-1 text-xs rounded-lg bg-brand-600/20 text-brand-400 font-bold border border-brand-500/40 active:scale-95';
        timerTargetSeconds = parseInt(btn.dataset.seconds, 10);
        localStorage.setItem(TIMER_PRESET_KEY, timerTargetSeconds);
        resetTimer();
      });
    });

    // Ustawienie początkowego presetu
    presetButtons.forEach(b => {
      if (parseInt(b.dataset.seconds, 10) === timerTargetSeconds) {
        b.click();
      }
    });

    // --- INICJALIZACJA DATY ---
    const today = new Date();
    headerDate.textContent = today.toLocaleDateString('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' });

    // --- PRZYCISKI KROKOWE CIĘŻAR / POWTÓRZENIA ---
    document.getElementById('btnWeightMinus').addEventListener('click', () => {
      let val = parseFloat(weightInput.value) || 0;
      weightInput.value = Math.max(0, val - 2.5);
    });
    document.getElementById('btnWeightPlus').addEventListener('click', () => {
      let val = parseFloat(weightInput.value) || 0;
      weightInput.value = val + 2.5;
    });
    document.getElementById('btnRepsMinus').addEventListener('click', () => {
      let val = parseInt(repsInput.value, 10) || 0;
      repsInput.value = Math.max(1, val - 1);
    });
    document.getElementById('btnRepsPlus').addEventListener('click', () => {
      let val = parseInt(repsInput.value, 10) || 0;
      repsInput.value = val + 1;
    });

    [weightInput, repsInput, exerciseInput].forEach(inp => {
      inp.addEventListener('focus', function() { this.select(); });
    });

    // Szybkie chipy ćwiczeń
    document.querySelectorAll('.quick-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        exerciseInput.value = btn.textContent.trim();
        loadLastValuesForExercise(exerciseInput.value);
      });
    });

    function loadLastValuesForExercise(name) {
      const last = [...sets].reverse().find(s => s.exercise.toLowerCase() === name.toLowerCase());
      if (last) {
        weightInput.value = last.weight;
        repsInput.value = last.reps;
      }
    }

    exerciseInput.addEventListener('change', () => {
      if (exerciseInput.value.trim()) {
        loadLastValuesForExercise(exerciseInput.value.trim());
      }
    });

    // --- ZAPIS SERII ---
    btnSaveSet.addEventListener('click', () => {
      const exercise = exerciseInput.value.trim();
      const weight = parseFloat(weightInput.value);
      const reps = parseInt(repsInput.value, 10);

      if (!exercise) {
        alert('Podaj lub wybierz nazwę ćwiczenia!');
        exerciseInput.focus();
        return;
      }
      if (isNaN(weight) || weight < 0 || isNaN(reps) || reps <= 0) {
        alert('Podaj poprawny ciężar oraz liczbę powtórzeń!');
        return;
      }

      const newSet = {
        id: Date.now().toString(),
        exercise,
        weight,
        reps,
        timestamp: new Date().toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' })
      };

      sets.push(newSet);
      saveSets();
      renderWorkout();
      renderActivePlanWidget();

      // Automatyczny start licznika przerwy po serii
      if (autoStartTimerCheck.checked) {
        resetTimer();
        startTimer();
      }

      // Lekkie kliknięcie haptyczne w telefonie
      if ('vibrate' in navigator) {
        navigator.vibrate(30);
      }
    });

    function saveSets() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sets));
    }

    // --- RENDEROWANIE TRENINGU ---
    function renderWorkout() {
      setsCountBadge.textContent = `${sets.length} ${sets.length === 1 ? 'seria' : sets.length < 5 ? 'serie' : 'serii'}`;

      if (sets.length === 0) {
        workoutContainer.innerHTML = `
          <div class="text-center py-10 px-4 bg-slate-900/40 rounded-2xl border border-dashed border-slate-800 text-slate-500">
            <p class="text-sm font-medium">Brak zapisanych serii na dzisiaj.</p>
            <p class="text-xs mt-1 text-slate-600">Wpisz ćwiczenie powyżej i kliknij „Zapisz serię”.</p>
          </div>
        `;
        return;
      }

      if (currentView === 'grouped') {
        renderGroupedView();
      } else {
        renderTimelineView();
      }
    }

    function renderGroupedView() {
      // Grupowanie serii według ćwiczenia z zachowaniem kolejności
      const groups = {};
      sets.forEach(s => {
        if (!groups[s.exercise]) groups[s.exercise] = [];
        groups[s.exercise].push(s);
      });

      workoutContainer.innerHTML = Object.entries(groups).map(([exercise, groupSets]) => {
        return `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 shadow">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2 mb-2">
              <span class="font-bold text-sm text-brand-400 cursor-pointer hover:underline" onclick="selectExercise('${exercise.replace(/'/g, "\\'")}')">
                ${exercise}
              </span>
              <span class="text-[11px] text-slate-400 font-mono">${groupSets.length} s.</span>
            </div>
            <div class="space-y-1.5">
              ${groupSets.map((s, idx) => `
                <div class="flex items-center justify-between text-xs bg-slate-950/50 px-2.5 py-1.5 rounded-lg">
                  <span class="text-slate-400 font-mono">Seria ${idx + 1}</span>
                  <span class="font-bold font-mono text-white">${s.weight} kg × ${s.reps}</span>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] text-slate-500">${s.timestamp}</span>
                    <button onclick="deleteSet('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTimelineView() {
      workoutContainer.innerHTML = `
        <div class="space-y-2">
          ${[...sets].reverse().map(s => `
            <div class="flex items-center justify-between bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl text-xs">
              <div>
                <p class="font-bold text-white">${s.exercise}</p>
                <p class="text-[11px] font-mono text-brand-400">${s.weight} kg × ${s.reps} powt.</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-500 font-mono">${s.timestamp}</span>
                <button onclick="deleteSet('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    window.selectExercise = function(name) {
      exerciseInput.value = name;
      loadLastValuesForExercise(name);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteSet = function(id) {
      if (confirm('Usunąć tę serię?')) {
        sets = sets.filter(s => s.id !== id);
        saveSets();
        renderWorkout();
        renderActivePlanWidget();
      }
    };

    // Przełączanie widoków
    document.getElementById('viewGrouped').addEventListener('click', () => {
      currentView = 'grouped';
      document.getElementById('viewGrouped').className = 'px-2 py-1 rounded font-semibold bg-brand-600 text-white transition';
      document.getElementById('viewTimeline').className = 'px-2 py-1 rounded font-semibold text-slate-400 hover:text-white transition';
      renderWorkout();
    });

    document.getElementById('viewTimeline').addEventListener('click', () => {
      currentView = 'timeline';
      document.getElementById('viewTimeline').className = 'px-2 py-1 rounded font-semibold bg-brand-600 text-white transition';
      document.getElementById('viewGrouped').className = 'px-2 py-1 rounded font-semibold text-slate-400 hover:text-white transition';
      renderWorkout();
    });

    // Czyszczenie całego dzisiejszego treningu
    document.getElementById('btnClearToday').addEventListener('click', () => {
      if (sets.length === 0) return;
      if (confirm('Czy na pewno chcesz zakończyć i wyczyścić dzisiejszy trening?')) {
        sets = [];
        saveSets();
        renderWorkout();
        renderActivePlanWidget();
        resetTimer();
      }
    });

    // --- MODUŁ PLANÓW TRENINGOWYCH ---
    const DEFAULT_TEMPLATES = [
      {
        name: 'FBW A (Krata)',
        exercises: [
          { name: 'Przysiad ze sztangą', targetSets: 4, targetReps: 8 },
          { name: 'Wyciskanie sztangi leżąc', targetSets: 4, targetReps: 8 },
          { name: 'Wiosłowanie sztangą w opadzie', targetSets: 4, targetReps: 8 },
          { name: 'Wyciskanie żołnierskie (OHP)', targetSets: 3, targetReps: 10 },
          { name: 'Uginanie ramion z hantlami', targetSets: 3, targetReps: 12 }
        ]
      },
      {
        name: 'FBW B (Plecy/Nogi)',
        exercises: [
          { name: 'Martwy ciąg', targetSets: 4, targetReps: 6 },
          { name: 'Wyciskanie hantli skos dodatni', targetSets: 4, targetReps: 10 },
          { name: 'Podciąganie na drążku', targetSets: 4, targetReps: 8 },
          { name: 'Wznosy bokiem na barki', targetSets: 3, targetReps: 15 },
          { name: 'Dipsy (pompki na poręczach)', targetSets: 3, targetReps: 10 }
        ]
      }
    ];

    const plansModal = document.getElementById('plansModal');
    document.getElementById('btnOpenPlans').addEventListener('click', () => {
      renderTemplatesList();
      plansModal.classList.remove('hidden');
    });
    document.getElementById('btnClosePlans').addEventListener('click', () => {
      plansModal.classList.add('hidden');
    });

    function renderTemplatesList() {
      const container = document.getElementById('templatesList');
      container.innerHTML = DEFAULT_TEMPLATES.map((tmpl, idx) => `
        <button onclick="activatePlanFromTemplate(${idx})" class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-brand-500 text-left transition active:scale-95">
          <p class="font-bold text-white text-xs">${tmpl.name}</p>
          <p class="text-[10px] text-slate-500 mt-0.5">${tmpl.exercises.length} ćwiczeń</p>
        </button>
      `).join('');
    }

    window.activatePlanFromTemplate = function(idx) {
      activePlan = DEFAULT_TEMPLATES[idx];
      localStorage.setItem(ACTIVE_PLAN_KEY, JSON.stringify(activePlan));
      plansModal.classList.add('hidden');
      renderActivePlanWidget();
    };

    document.getElementById('btnSaveCustomPlan').addEventListener('click', () => {
      const name = document.getElementById('customPlanName').value.trim() || 'Własny Plan';
      const text = document.getElementById('customPlanText').value.trim();
      if (!text) {
        alert('Wklej przynajmniej jedno ćwiczenie!');
        return;
      }
      const lines = text.split('\n').filter(l => l.trim().length > 0);
      const exercises = lines.map(line => {
        const parts = line.split('|').map(p => p.trim());
        return {
          name: parts[0],
          targetSets: parseInt(parts[1], 10) || 3,
          targetReps: parseInt(parts[2], 10) || 10
        };
      });

      activePlan = { name, exercises };
      localStorage.setItem(ACTIVE_PLAN_KEY, JSON.stringify(activePlan));
      plansModal.classList.add('hidden');
      renderActivePlanWidget();
    });

    document.getElementById('btnCloseActivePlan').addEventListener('click', () => {
      if (confirm('Ukryć aktywny plan?')) {
        activePlan = null;
        localStorage.removeItem(ACTIVE_PLAN_KEY);
        renderActivePlanWidget();
      }
    });

    function renderActivePlanWidget() {
      const widget = document.getElementById('activePlanWidget');
      if (!activePlan) {
        widget.classList.add('hidden');
        return;
      }
      widget.classList.remove('hidden');
      document.getElementById('activePlanTitle').textContent = activePlan.name;

      let totalTargetSets = 0;
      let totalCompletedSets = 0;

      const exContainer = document.getElementById('activePlanExercises');
      exContainer.innerHTML = activePlan.exercises.map(ex => {
        const count = sets.filter(s => s.exercise.toLowerCase() === ex.name.toLowerCase()).length;
        totalTargetSets += ex.targetSets;
        totalCompletedSets += Math.min(count, ex.targetSets);
        const isDone = count >= ex.targetSets;

        return `
          <button onclick="selectPlanExercise('${ex.name.replace(/'/g, "\\'")}', ${ex.targetReps})" class="px-2.5 py-1.5 rounded-lg border text-left whitespace-nowrap active:scale-95 transition flex items-center gap-1.5 ${
            isDone 
              ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' 
              : 'bg-slate-950/80 border-slate-800 text-slate-300 hover:border-slate-700'
          }">
            <span class="text-xs font-medium">${ex.name}</span>
            <span class="text-[10px] font-mono px-1 py-0.2 rounded ${isDone ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${count}/${ex.targetSets}</span>
          </button>
        `;
      }).join('');

      const progress = totalTargetSets > 0 ? (totalCompletedSets / totalTargetSets) * 100 : 0;
      document.getElementById('planProgressBar').style.width = `${progress}%`;
    }

    window.selectPlanExercise = function(name, defaultReps) {
      exerciseInput.value = name;
      repsInput.value = defaultReps || 8;
      loadLastValuesForExercise(name);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Inicjalizacja przy starcie
    renderWorkout();
    renderActivePlanWidget();
    updateTimerUI();
  </script>
</body>
</html>
